name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.2'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - name: Validate package metadata
        run: composer validate --strict --no-check-lock
      - name: Install latest compatible dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Install lowest supported dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Tests, static analysis, and formatting
        run: composer check
